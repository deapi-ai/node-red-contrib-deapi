name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}, Node-RED ${{ matrix.node-red }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines.node is >=20 and node-red.version is >=4.0.0. Node-RED 5 needs Node.js >=22.9.
        include:
          - { node-version: '20', node-red: '4' }
          - { node-version: '22', node-red: '4' }
          - { node-version: '24', node-red: '4' }
          - { node-version: '22', node-red: '5' }
          - { node-version: '24', node-red: '5' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Use Node-RED ${{ matrix.node-red }}
        if: matrix.node-red != '4'
        run: npm install --no-save "node-red@${{ matrix.node-red }}"

      - name: Test (with coverage)
        run: |
          node -p "'node-red ' + require('node-red/package.json').version"
          npm run test:coverage

      - name: Package contents
        run: npm pack --dry-run
