name: Publish to npm

# Publishes on a version tag (vX.Y.Z) with npm trusted publishing (OIDC) and provenance.
# No NPM_TOKEN secret: configure this repo + workflow as the trusted publisher on npmjs.com.

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Pin npm with OIDC trusted publishing support
        run: npm install -g npm@11.21.2

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="v$(node -p "require('./package.json').version")"
          GIT_TAG="${GITHUB_REF#refs/tags/}"
          if [ "$PACKAGE_VERSION" != "$GIT_TAG" ]; then
            echo "Tag $GIT_TAG does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: Skip if this version is already on npm
        id: already
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on npm, skipping."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.already.outputs.already != 'true'
        run: npm publish --provenance --access public
